name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library's floor is C89 and its ceiling is whatever the compiler offers.
  # A claim about historical C that nothing checks is not a claim.
  standards:
    name: ${{ matrix.os }} / ${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
        std: [ c89, c99, c11, c17 ]
        # MSVC is an honoured design constraint of this port -- no __int128,
        # a 16-bit wchar_t, __forceinline instead of always_inline -- and
        # until this leg existed, every one of those accommodations was
        # asserted by reasoning rather than executed by a compiler. cl has no
        # /std:c89 or /std:c99; its default C mode is C89 plus Microsoft
        # extensions, so the `msvc` row is the closest executable form of the
        # C89-floor claim, and c11/c17 are the modes cl actually offers.
        include:
          - os: windows-2025
            std: msvc
          - os: windows-2025
            std: c11
          - os: windows-2025
            std: c17
    steps:
      - uses: actions/checkout@v7

      - name: Test
        if: runner.os != 'Windows'
        run: make test CSTD=${{ matrix.std }}
      - name: Golden wire
        if: runner.os != 'Windows'
        run: make golden CSTD=${{ matrix.std }}
      - name: STANDARD.md wstring example
        if: runner.os != 'Windows'
        run: make wstest CSTD=${{ matrix.std }}

      # No make on the Windows runner and no /std flag in the msvc row: the
      # suites are the same ones the Makefile runs, compiled with cl -- and
      # the LIST is the Makefile's too (issue #37): MSVC_SUITES there is the
      # one enumeration, parsed here with findstr, and a parse-time guard in
      # the Makefile turns any drift between it and `make test`'s own list
      # into a red make on every Makefile-driven leg. A suite added to the
      # Makefile reaches this leg with no edit to this file; what stays out,
      # and why, is NOT_ON_MSVC beside it. vswhere locates Visual Studio
      # (the documented way), vcvars64 puts cl on the PATH. golden matters
      # here beyond compilation: Windows is where wchar_t is 16 bits, so the
      # pinned wide vectors prove the UTF-16 wire path on the platform the
      # design accommodates.
      #
      # precomputed is the mas-bandwidth/schema#82 differential, and this is
      # the one leg in the matrix that never receives -ffp-contract=off:
      # cl has no such flag, so the compressed float's two roundings are held
      # here by whatever /fp:precise does and by nothing else. That makes it
      # the only place the library's own default-contraction behaviour is
      # executed rather than reasoned about, which is exactly where a
      # differential over the quantization arithmetic belongs.
      - name: Run the Makefile's MSVC suite list (cl)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if not "${{ matrix.std }}"=="msvc" set "STDFLAG=/std:${{ matrix.std }}"
          for /f "tokens=1,* delims==" %%a in ('findstr /r /c:"^MSVC_SUITES *=" Makefile') do set "SUITES=%%b"
          if not defined SUITES ( echo MSVC_SUITES not found in Makefile & exit /b 1 )
          echo suites:%SUITES%
          for %%t in (%SUITES%) do (
            cl /nologo /W4 /O2 %STDFLAG% /I. test\%%t.c serialize.c /Fe:%%t.exe || exit /b 1
            .\%%t.exe || exit /b 1
          )

  # THE job that matters most for this port.
  #
  # A round trip test cannot catch an endianness bug: if the packer wrote the
  # scratch word in the wrong byte order, the reader would read it back in the
  # same wrong order and every round trip would pass while the bytes were
  # incompatible with the other four languages. Only a PINNED GOLDEN run on a
  # big-endian machine proves the byte order is right, and s390x under qemu is
  # the cheapest big-endian machine there is.
  #
  # test/golden.c pins TWO sequences and this job runs both. The second is the
  # 128-bit, fixed point and wide string surface -- a hand-rolled two-lane
  # 64-bit emulation, and so the likeliest place in the library for a byte
  # order bug. It is also the part a round trip proves least about, which is
  # exactly why it has to be pinned and run here.
  big-endian:
    name: big endian s390x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install s390x cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static

      # The suite list is the Makefile's own (issue #37): this leg runs the
      # same `make test golden wstest` the ubuntu/macos legs run, only
      # through the s390x cross compiler, so a suite added to the Makefile
      # runs big-endian by construction -- this file holds no list to forget.
      # -static so the emulated binaries need no s390x sysroot, and
      # binfmt_misc (registered when qemu-user-static installs) runs them
      # transparently, which is what lets make's ordinary ./build/<suite>
      # recipe lines execute unchanged.
      #
      # That list includes the mas-bandwidth/schema#82 precomputed
      # differential, which pins wire bytes and decoded bit patterns --
      # ~4.7 million comparisons between the split compressed float and a
      # frozen copy of the code it replaced -- so running it here is what
      # says the split is byte identical on a big-endian host and not merely
      # on the two little-endian ones. It also includes assertdeath
      # (qemu-user forwards fork, waitpid and SIGABRT) and precomputed-fma
      # (gcc 13 maps -ffp-contract=on to =fast, so that binary stands down
      # with its printed reason until the cross toolchain reaches gcc 14).
      - name: Build and run every suite big-endian
        run: |
          make test golden wstest CC=s390x-linux-gnu-gcc \
            CFLAGS='-std=c99 -Wall -Wextra -O2 -ffp-contract=off -static'

  # Byte-compares this library against the C++ one over the same sequence.
  # The port exists to be wire compatible; everything else is detail.
  #
  # THE FAMILY PIN -- ONE POLICY, ONE VERSION. The C++ checkout is pinned to the
  # latest RELEASED tag of mas-bandwidth/serialize, never main, and to the SAME
  # tag in all four wire-compat gates, so "compatible with C++" means the same
  # thing in every port. Never main, because an upstream merge mid-day must not
  # change what a commit's CI proves -- the sibling-HEAD race broke family gates
  # three separate times (2026-08-16/17). Find the newest tag with:
  #   gh release list --repo mas-bandwidth/serialize --limit 1
  # Bump family-wide, deliberately, in its own commit per repo, and only
  # alongside the byte-identity check this gate runs.
  # This is the one pin in this workflow; bumping it is a one-line edit of
  # SERIALIZE_TAG below.
  # (spec-sync below deliberately stays on upstream main: drift DETECTION is
  # that job's whole purpose.)
  wire-compat:
    name: wire compatible with the C++ library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out the C++ library (pinned release)
        env:
          # v1.12.0 is the floor: v1.11.0 is the first release carrying
          # serialize_compressed_float_precomputed, which diff3_cpp.cpp drives,
          # and v1.12.0 is the first carrying the normative integer clamp
          # (STANDARD.md, schema#109), which diff3's two clamp witnesses make
          # load-bearing -- against an older header those rows go red, the
          # cross-language proof serialize#94 found missing.
          SERIALIZE_TAG: v1.14.0
        run: git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git ../serialize
      - name: Compare
        run: make diff

  # -fno-sanitize-recover=all is load-bearing: without it ubsan prints its
  # report and lets the process continue to a green exit, so an undefined
  # operation whose fallout happens to round-trip (NaN through a float-to-
  # unsigned cast does, on arm64) never fails the job.
  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          make test CFLAGS="-std=c99 -Wall -Wextra -pedantic -g -O1 -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          make golden CFLAGS="-std=c99 -Wall -Wextra -pedantic -g -O1 -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          make wstest CFLAGS="-std=c99 -Wall -Wextra -pedantic -g -O1 -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

  # The untrusted read boundary, explored rather than enumerated. The fixed
  # suites prove the paths someone thought of; sixty seconds of libFuzzer per
  # push is the smoke test for the paths nobody did — run against the unfixed
  # NaN clamp, this harness finds the serialize.c:232 float-to-unsigned trap in
  # under three minutes. The extended run lives in nightly-fuzz.yml. fuzz.c is
  # the port of the C++ library's fuzz.cpp; this job mirrors its fuzz job.
  fuzz:
    name: fuzz (libFuzzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz
        run: make fuzz

  # STANDARD.md here is a VERBATIM VENDORED COPY of the specification in
  # mas-bandwidth/serialize. A duplicated normative document is the same
  # failure as a duplicated constant, except it drifts silently.
  standard:
    name: STANDARD.md matches upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare against mas-bandwidth/serialize
        run: |
          curl -fsSL -o /tmp/upstream-STANDARD.md \
            https://raw.githubusercontent.com/mas-bandwidth/serialize/main/STANDARD.md
          echo "upstream: mas-bandwidth/serialize@$(git ls-remote https://github.com/mas-bandwidth/serialize.git refs/heads/main | cut -f1)"
          diff -u /tmp/upstream-STANDARD.md STANDARD.md

  version:
    name: version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the header version matches its parts
        run: |
          full=$(sed -nE 's/^#define SERIALIZE_VERSION[[:space:]]+"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' serialize.h)
          major=$(sed -nE 's/^#define SERIALIZE_VERSION_MAJOR[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          minor=$(sed -nE 's/^#define SERIALIZE_VERSION_MINOR[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          patch=$(sed -nE 's/^#define SERIALIZE_VERSION_PATCH[[:space:]]+([0-9]+).*/\1/p' serialize.h)
          if [ -z "$full" ] || [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "::error::could not extract the version from serialize.h"; exit 1
          fi
          if [ "$full" != "$major.$minor.$patch" ]; then
            echo "::error::SERIALIZE_VERSION is $full but the parts say $major.$minor.$patch"; exit 1
          fi
          echo "version $full"
